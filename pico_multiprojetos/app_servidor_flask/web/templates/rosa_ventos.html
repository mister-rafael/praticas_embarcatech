<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rosa dos Ventos Minimalista</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/estilo_rosa1.css"> <!-- Incluindo o arquivo CSS -->
</head>

<body>
    <div class="angle-display" id="angleDisplay">0°</div> <!-- Exibição do Angulo Atual -->

    <div class="compass-container"> <!-- Contêiner da Rosa dos Ventos -->
        <div class="compass-rose" id="compassRose">
            <!-- Marcas de graus -->
            <div class="degree-marks" id="degreeMarks">
                <div class="degree-mark major" style="transform: rotate(0deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 0° -->
                <div class="degree-mark" style="transform: rotate(5deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(10deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(15deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(20deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(25deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(30deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 30° -->
                <div class="degree-mark" style="transform: rotate(35deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(40deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(45deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(50deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(55deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(60deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 60° -->
                <div class="degree-mark" style="transform: rotate(65deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(70deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(75deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(80deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(85deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(90deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 90° -->
                <div class="degree-mark" style="transform: rotate(95deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(100deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(105deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(110deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(115deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(120deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 120° -->
                <div class="degree-mark" style="transform: rotate(125deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(130deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(135deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(140deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(145deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(150deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 150° -->
                <div class="degree-mark" style="transform: rotate(155deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(160deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(165deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(170deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(175deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(180deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 180° -->
                <div class="degree-mark" style="transform: rotate(185deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(190deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(195deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(200deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(205deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(210deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 210° -->
                <div class="degree-mark" style="transform: rotate(215deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(220deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(225deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(230deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(235deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(240deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 240° -->
                <div class="degree-mark" style="transform: rotate(245deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(250deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(255deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(260deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(265deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(270deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 270° -->
                <div class="degree-mark" style="transform: rotate(275deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(280deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(285deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(290deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(295deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(300deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 300° -->
                <div class="degree-mark" style="transform: rotate(305deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(310deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(315deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(320deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(325deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark major" style="transform: rotate(330deg) translateX(-50%) translateY(-100%);">
                </div> <!-- Marca de grau 330° -->
                <div class="degree-mark" style="transform: rotate(335deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(340deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(345deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(350deg) translateX(-50%) translateY(-100%);"></div>
                <div class="degree-mark" style="transform: rotate(355deg) translateX(-50%) translateY(-100%);"></div>
            </div>

            <!-- Anel externo -->
            <div class="outer-ring"></div>

            <!-- Linhas cardeais -->
            <div class="cardinal-line vertical"></div>
            <div class="cardinal-line horizontal"></div>

            <!-- Linhas intercardeais -->
            <div class="intercardinal-line ne-sw"></div>
            <div class="intercardinal-line nw-se"></div>

            <!-- Direções -->
            <div class="direction north">N</div>
            <div class="direction east">L</div>
            <div class="direction south">S</div>
            <div class="direction west">O</div>

            <!-- Estrela da Rosa dos Ventos (ponteiro) -->
            <svg class="compass-star" id="compassStar" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
                style="transform: translate(-50%, -50%) rotate(0deg);">
                <!-- Pontos cardeais principais -->
                <polygon points="100,10 110,90 190,100 110,110 100,190 90,110 10,100 90,90" fill="none"
                    stroke="rgba(255,255,255,0.8)" stroke-width="2"></polygon>

                <!-- Pontos intercardeais -->
                <polygon points="100,30 105,95 170,100 105,105 100,170 95,105 30,100 95,95" fill="none"
                    stroke="rgba(255,255,255,0.6)" stroke-width="1.5"></polygon>

                <!-- Pontas principais -->
                <polygon points="100,10 110,90 100,100 90,90" fill="#e74c3c" stroke="rgba(255,255,255,0.8)"
                    stroke-width="1"></polygon>
                <polygon points="190,100 110,110 100,100 110,90" fill="rgba(255,255,255,0.8)"
                    stroke="rgba(255,255,255,0.8)" stroke-width="1"></polygon>
                <polygon points="100,190 90,110 100,100 110,110" fill="rgba(255,255,255,0.8)"
                    stroke="rgba(255,255,255,0.8)" stroke-width="1"></polygon>
                <polygon points="10,100 90,90 100,100 90,110" fill="rgba(255,255,255,0.8)"
                    stroke="rgba(255,255,255,0.8)" stroke-width="1"></polygon>

                <!-- Pontas intercardeais -->
                <polygon points="135,35 105,95 100,100 95,95" fill="rgba(255,255,255,0.5)"
                    stroke="rgba(255,255,255,0.6)" stroke-width="0.5"></polygon>
                <polygon points="165,135 95,105 100,100 105,105" fill="rgba(255,255,255,0.5)"
                    stroke="rgba(255,255,255,0.6)" stroke-width="0.5"></polygon>
                <polygon points="65,165 95,105 100,100 105,105" fill="rgba(255,255,255,0.5)"
                    stroke="rgba(255,255,255,0.6)" stroke-width="0.5"></polygon>
                <polygon points="35,65 95,95 100,100 95,105" fill="rgba(255,255,255,0.5)" stroke="rgba(255,255,255,0.6)"
                    stroke-width="0.5"></polygon>

                <!-- Centro -->
                <circle cx="100" cy="100" r="5" fill="rgba(255,255,255,0.8)" stroke="rgba(0,0,0,0.3)" stroke-width="1">
                </circle>
            </svg>

            <!-- Centro da bússola -->
            <div class="compass-center"></div>
        </div>
    </div> <!-- Fim do contêiner da Rosa dos Ventos -->

    <div class="controls"> <!-- Controles para o ponteiro -->
        <button class="control-btn" id="rotateLeft">⟲ Esquerda</button>
        <button class="control-btn" id="resetPointer">↻ Reset</button>
        <button class="control-btn" id="rotateRight">⟳ Direita</button>
    </div>

    <!-- Carrega a biblioteca Socket.IO diretamente do CDN -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Local destinado a inclusão do JavaScript -->
    <script src="../js/script_rosa.js"></script>

    <iframe height="1" width="1"
        style="position: absolute; top: 0px; left: 0px; border: medium; visibility: hidden;"></iframe>
</body>

</html>
